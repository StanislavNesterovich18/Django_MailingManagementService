<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Система рассылок{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'mailing:mailing_list' %}">
                <i class="bi bi-envelope-paper me-2"></i>Рассылки
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:mailing_list' %}">
                            <i class="bi bi-list-ul me-1"></i>Список рассылок
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'mailing:create_mailing' %}">
                            <i class="bi bi-plus-circle me-1"></i>Создать рассылку
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'send_messages:message_list' %}">
                            <i class="bi bi-plus-circle me-1"></i>Сообщения
                        </a>
                    </li>
                </ul>
                {% if user.is_authenticated %}
                <div class="navbar-nav">
                    <span class="nav-item nav-link text-light">
                        <i class="bi bi-person-circle me-1"></i>{{ user.email }}
                    </span>
                    <a class="nav-item nav-link" href="{% url 'client:logout' %}">
                        <i class="bi bi-box-arrow-right me-1"></i>Выйти
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <!-- Сообщения -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Контент -->
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
